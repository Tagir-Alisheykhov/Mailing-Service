{% extends 'messenger/base.html' %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
          <div class="card shadow-sm">
            <div class="card-body">
              <p class="card-text">Начало: {{ object.start_datetime }}</p>
              <p class="card-text">Окончание: {{ object.end_datetime }}</p>
              <p class="card-text">Статус: {{ object.mailing_status }}</p>
              <p class="card-text">Сообщение: {{ object.message }}</p>
              <p class="card-text">Получатели: {{ object.recipients }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-info" href="{% if object.mailing_status == 'created' %}{% url 'messenger:mailing_created' %}{% elif object.mailing_status == 'running' %}{% url 'messenger:mailing_running' %}{% elif object.mailing_status == 'completed' %}{% url 'messenger:mailing_completed' %}{% else %}{% url 'messenger:mailing_list' %}{% endif %}" role="button">Назад</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
