<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}OpusMail{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"  rel="stylesheet">
<!--  <link rel="stylesheet" href="/static/css/bootstrap.min.css">-->

  <!-- Font Awesome (для иконок, если понадобятся) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"  rel="stylesheet">

  <!-- Custom styles -->
<!--  {% block styles %}-->
<!--  {% endblock %}-->
</head>
<body>

  <!-- Навигационная панель -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'home' %}">OpusMail</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Рассылки</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Получатели</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Основное содержимое страницы -->
  <div class="container-fluid px-4">
    {% block content %}
    {% endblock %}
  </div>

  <!-- Footer -->
  <footer class="bg-light py-4 mt-5 border-top">
    <div class="container-fluid">
      <p class="mb-0 text-center text-muted">&copy; {{ current_year }} Сервис email-рассылок</p>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!--  <script src="/static/js/bootstrap.bundle.min.js"></script>-->
  <!-- Custom scripts -->
  {% block scripts %}
  {% endblock %}
</body>
</html>
