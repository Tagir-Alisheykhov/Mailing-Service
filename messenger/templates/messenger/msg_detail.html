{% extends 'messenger/base.html' %}

{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
          <div class="card shadow-sm">
            <div class="card-body">
              <p class="card-text">Тема: {{ object.topic }}</p>
              <p class="card-text">Содержимое: {{ object.body }}</p>
              <p class="card-text">Почта: {{ object.recipient_email }}</p>
              <p class="card-text">Статус: {% if object.is_sent is True %}Отправлено{% else %}Ожидает отправки{% endif %}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-info" href="{% if object.is_sent is True %}{% url 'messenger:sent_msg' %}{% else %}{% url 'messenger:draft_msg' %}{% endif %}" role="button">Назад</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
