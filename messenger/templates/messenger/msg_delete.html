{% extends 'messenger/base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text">Вы действительно хотите удалить сообщение?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <div class="row">
                        <div class="col-4"></div>
                        <div class="col-4">
                            <div class="d-flex gap-3 justify-content-center align-items-center mb-2">
                                <button type="submit" class="btn btn-danger">Удалить</button>
                                <a class="btn btn-primary" href="{% url 'messenger:draft_msg' %}" role="button">Отменить</a>
                            </div>
                        </div>
                        <div class="col-4"></div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
