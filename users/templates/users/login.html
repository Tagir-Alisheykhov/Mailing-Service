{% extends 'messenger/base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-2"></div>
    <div class="col-8">
        <h2>Вход на сайт</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning mb-3">Войти</button>
            <p><a href="{% url 'users:password_reset' %}">Забыли пароль?</a></p>
        </form>
    </div>
    <div class="col-2"></div>
</div>
{% endblock %}
