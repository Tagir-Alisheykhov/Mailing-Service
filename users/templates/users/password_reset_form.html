{% extends 'messenger/base.html' %}

{% block content %}

<h2 class="mt-4">Восстановления пароля</h2>

<form method="post">
    {% csrf_token %}
    {% for f in form %}
        <p><label class="form-label" for="{{ f.id_for_label }}" >{{ f.label }}</label></p>
        {{ f }}
        <div class="form-error">{{ f.errors }}</div>
    {% endfor %}
    <div class="row mt-4">
    <p><button type="submit">Сбросить по email</button></p>
    </div>
</form>


{% endblock %}
